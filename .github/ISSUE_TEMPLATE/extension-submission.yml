name: Extension submission
description: Propose an immutable extension release for registry review.
title: "[Extension]: "
labels: [extension-submission]
body:
  - type: input
    id: package-id
    attributes:
      label: Package ID
      placeholder: infiniti.example
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: release-url
    attributes:
      label: Immutable GitHub Release URL
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permissions and rationale
      description: List every requested capability and why it is necessary.
    validations:
      required: true
