name: Sign registry candidate
on:
  workflow_run:
    workflows: [Prepare registry publication]
    types: [completed]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  candidate:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request_target' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.lookup.outputs.present }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          found="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[]|select(.name=="prepared-index" and .expired==false)]|length')"
          if [[ "$found" == 1 ]]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
  sign:
    needs: candidate
    if: needs.candidate.outputs.present == 'true'
    runs-on: ubuntu-latest
    environment: registry-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-index
          path: ${{ runner.temp }}/signing-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.CLIPSX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CLIPSX_RELEASE_APP_PRIVATE_KEY }}
          owner: azure06
          repositories: clipsx-registry
      - name: Sign validated bytes and update only the existing PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_STATUS_TOKEN: ${{ github.token }}
          CLIPSX_REGISTRY_KEY_ID: infiniti-registry-2026-01
          CLIPSX_REGISTRY_SIGNING_KEY_PEM: ${{ secrets.CLIPSX_REGISTRY_SIGNING_KEY_PEM }}
          CLIPSX_REGISTRY_SECONDARY_KEY_ID: ${{ vars.CLIPSX_REGISTRY_SECONDARY_KEY_ID }}
          CLIPSX_REGISTRY_SECONDARY_SIGNING_KEY_PEM: ${{ secrets.CLIPSX_REGISTRY_SECONDARY_SIGNING_KEY_PEM }}
        run: node scripts/sign-publication.mjs "$RUNNER_TEMP/signing-data"
      - name: Report signing failure to readiness
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/report-signing-failure.mjs "$RUNNER_TEMP/signing-data"
