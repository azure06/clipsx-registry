name: Registry validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the pinned ClipsX validator
        uses: actions/checkout@v4
        with:
          repository: azure06/clipsx
          path: clipsx-host
          ref: 65bc19e38427561a4a3e85129c9314de57e02e1a
      - name: Install host validator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npm test
      - name: Build independent package validator
        run: cargo build --locked --manifest-path clipsx-host/src-tauri/Cargo.toml --bin clipsx-extension-tool
      - name: Validate metadata, signatures, icons, and immutable archives
        env:
          EXTENSION_TOOL: ${{ github.workspace }}/clipsx-host/src-tauri/target/debug/clipsx-extension-tool
          REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run validate:source -- --download-dir .downloads --verify-releases
      - name: Validate existing signature and require atomic signed publication
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA:index.json" 2>/dev/null; then
            test -f index.json && test -f index.signatures.json
          fi
          if [[ -f index.json || -f index.signatures.json ]]; then
            test -f index.json && test -f index.signatures.json
            npm run validate
          fi
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            if ! git diff --quiet "$BASE_SHA" -- index.json index.signatures.json; then
              npm run validate -- --require-current
            fi
          fi
